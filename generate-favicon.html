<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Generate Favicon</title>
</head>

<body>
    <h1>Favicon Generator</h1>
    <canvas id="canvas" width="64" height="64"></canvas>
    <br><br>
    <button onclick="downloadICO()">Download as favicon.ico (64x64)</button>
    <br><br>
    <canvas id="canvas512" width="512" height="512"></canvas>
    <br><br>
    <button onclick="downloadPNG512()">Download as favicon-512.png</button>

    <script>
        // Generate 64x64 favicon
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Purple gradient background
        const gradient = ctx.createLinearGradient(0, 0, 64, 64);
        gradient.addColorStop(0, '#8b5cf6');
        gradient.addColorStop(1, '#6366f1');

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 64, 64);

        // Draw wallet emoji
        ctx.font = 'bold 40px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('💰', 32, 32);

        // Generate 512x512 for better quality
        const canvas512 = document.getElementById('canvas512');
        const ctx512 = canvas512.getContext('2d');

        const gradient512 = ctx512.createLinearGradient(0, 0, 512, 512);
        gradient512.addColorStop(0, '#8b5cf6');
        gradient512.addColorStop(1, '#6366f1');

        ctx512.fillStyle = gradient512;
        ctx512.fillRect(0, 0, 512, 512);

        ctx512.font = 'bold 320px Arial';
        ctx512.textAlign = 'center';
        ctx512.textBaseline = 'middle';
        ctx512.fillText('💰', 256, 256);

        function downloadICO() {
            const link = document.createElement('a');
            link.download = 'favicon.ico';
            link.href = canvas.toDataURL('image/x-icon');
            link.click();
        }

        function downloadPNG512() {
            const link = document.createElement('a');
            link.download = 'favicon-512.png';
            link.href = canvas512.toDataURL('image/png');
            link.click();
        }
    </script>
</body>

</html>
