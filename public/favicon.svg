<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="url(#grad)" rx="20"/>
  
  <!-- Wallet Icon -->
  <g transform="translate(50, 50)">
    <!-- Wallet body -->
    <rect x="-28" y="-18" width="56" height="36" rx="4" fill="#fff" opacity="0.95"/>
    
    <!-- Wallet fold -->
    <path d="M -28 -8 L -28 -18 Q -28 -22 -24 -22 L 24 -22 Q 28 -22 28 -18 L 28 -8 Z" fill="#fff" opacity="0.8"/>
    
    <!-- Money symbol -->
    <circle cx="0" cy="2" r="12" fill="#6366f1"/>
    <text x="0" y="2" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle" dominant-baseline="central">ج</text>
  </g>
</svg>
